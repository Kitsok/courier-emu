[modem]
profile = analog403
tty = artifacts/courier-emu.tty
# Optional existing serialsim endpoint; when set, tty publication is unused.
serialsim =
nvram = artifacts/courier-emu-v32.nvram

[sip]
server = 192.168.196.254:5060
target = sip:{number}@192.168.196.254
username = 201
password_env = COURIER_SIP_PASSWORD
bind = 0.0.0.0
advertise = 0.0.0.0
port = 5074
rtp_port = 4014
codec = pcmu

[logging]
level = normal
report =

[audio]
enabled = true
volume = 0.25

[line]
tx_gain = 0.25
local_echo = false
